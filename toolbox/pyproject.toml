[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml_multi_dim_toolbox"
version = "1.1.0"
description = "Toolbox for multidimensional data in machine learning"
authors = [{ name = "Markus de Koster" }]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "setuptools",
    "numpy >= 1.23.5, < 1.24",
]

[project.optional-dependencies]
tests = ["pytest >= 7.3.1"]

[project.urls]
Home = "https://github.com/th-koeln-iet/toolbox"
Quirinus = "https://git.rwth-aachen.de/quirinus-control/multi-dim-processor"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]



