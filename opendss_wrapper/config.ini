[DEFAULT]
data_path = ./data/
; sub path for simulation results and additional logging, immediately below data_path
results_sub_path = tmp
power_profile_db_name = power_profiles.db
spectrum_db_name = spectra.db
log_path = ./data/logs/

[POSTGRESQL]
host = localhost
port = 5432
dbname = name
user = user
password = pw

[CONSTANTS]
; OpenDSS does not allow 0 as DC frequency, therefore a small value is used which should be constant
dc_frequency = 0.000001
; Short circuit factor for tolerance of the external grid. Used in short circuit vsource calculations
short_circuit_ext_grid_tolerance = 1.1

[SIMULATION]
; [True, False] if True, the simulation will be run in parallel
multi_processing = False
; [True, False] if True, each load / generator will receive an additional monitor (mostly relevant for currents and power)
monitor_loads = False
monitor_generators = False
; default voltage and current only. If True, also monitor power
monitor_power = False
; [cubic_spline, linear] harmonic spectra interpolation method (other options supported)
spectra_interpolation = linear

[LOGGING]
; [VERBOSE, NONE] if VERBOSE, the simulation results will be saved in individual output files with additional logging
sim_debug_mode = NONE
; [True, False] if True, the program will plot simulation results and spectra and save plots to the output folder
sim_debug_plot = False
