[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OpenDSSWrapper"
version = "0.5.0"
description = "Simulate openDSS networks"
authors = [{ name = "Markus de Koster" }, { name = "Patrick Mack" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "setuptools",
    "numpy >= 1.23.5, < 1.24",
    "pandapower >= 2.12.1",
    "matplotlib >= 3.7.1",
    "seaborn",
    "tqdm >= 4.65.0",
    "pandas >= 2.0.0",
    "OpenDSSDirect.py[extras]",
    "tables",
    "scipy",
    "h5py",
    "psycopg2-binary",
    "coloredlogs",
    "cimpyorm",
    "sqlalchemy <= 1.3.15" # specific version required for cimpyorm (required for cgmes conversion)
]

[project.optional-dependencies]
tests = ["pytest >= 7.3.1"]

[project.urls]
Home = "https://github.com/th-koeln-iet/opendss-wrapper"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]



